<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>JeBoss Live</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="JeBoss" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#03050c" />

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #03050c;
      --panel: rgba(13, 17, 34, 0.72);
      --accent: #00d2ff;
      --accent-glow: rgba(0, 210, 255, 0.45);
      --purple-glow: rgba(138, 43, 226, 0.5);
      --text: #f0f4fc;
      --muted: #79869f;
    }
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100dvh;
      width: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      background-image: 
        radial-gradient(circle at 50% 25%, #0f1842 0%, transparent 60%),
        radial-gradient(circle at 80% 80%, #150a2b 0%, transparent 50%),
        radial-gradient(circle at 20% 70%, #061930 0%, #03050c 80%);
      color: var(--text);
      overflow: hidden;
    }
    .app {
      min-height: 100dvh;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: max(16px, env(safe-area-inset-top)) 16px max(20px, env(safe-area-inset-bottom));
      position: relative;
    }

    /* Фоновый канвас для плавающих звезд/частиц */
    #spaceCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      opacity: 0.75;
    }

    /* Премиальный стеклянный хедер */
    .header {
      width: 100%;
      max-width: 440px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px;
      background: var(--panel);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: 26px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      z-index: 10;
    }
    .header-left {
      text-align: left;
    }
    .title {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status {
      font-size: 12px;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 2px;
    }
    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #555;
      transition: background 0.3s, box-shadow 0.3s;
    }
    .status-dot.active {
      background: #00f076;
      box-shadow: 0 0 10px #00f076, 0 0 20px rgba(0, 240, 118, 0.4);
    }

    .center {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      width: 100%;
      max-width: 440px;
      position: relative;
      z-index: 10;
    }

    /* ========================================= */
    /* ЖИВАЯ КВАНТОВАЯ СИНГУЛЯРНОСТЬ             */
    /* ========================================= */
    .portal-wrapper {
      position: relative;
      width: 230px;
      height: 230px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .portal-wrapper:active {
      transform: scale(0.94);
    }

    /* Внешний диффузный туман гравитации */
    .portal-nebula {
      position: absolute;
      width: 280px;
      height: 280px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0, 210, 255, 0.25) 0%, rgba(138, 43, 226, 0.2) 50%, transparent 72%);
      filter: blur(20px);
      animation: nebulaBreath 4s infinite alternate ease-in-out;
      pointer-events: none;
    }
    @keyframes nebulaBreath {
      0% { transform: scale(0.92); opacity: 0.6; }
      100% { transform: scale(1.15); opacity: 1; }
    }

    /* Аккреционный диск света */
    .accretion-disk {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: conic-gradient(
        from 0deg,
        #ff007f 0deg,
        #00d2ff 90deg,
        #7928ca 180deg,
        #00f0ff 270deg,
        #ff007f 360deg
      );
      filter: blur(14px);
      opacity: 0.9;
      animation: spinAccretion 5s linear infinite;
    }
    @keyframes spinAccretion {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* Космические орбитальные кольца */
    .orbit-ring {
      position: absolute;
      width: 92%;
      height: 92%;
      border-radius: 50%;
      border: 1.5px solid rgba(0, 210, 255, 0.45);
      border-top-color: #ff007f;
      border-bottom-color: #00f0ff;
      filter: drop-shadow(0 0 8px rgba(0, 210, 255, 0.5));
      animation: spinOrbit 3.6s linear infinite;
    }
    @keyframes spinOrbit {
      from { transform: rotate(360deg) scale(1.02); }
      to { transform: rotate(0deg) scale(0.98); }
    }

    /* Горизонт событий черной дыры */
    .event-horizon {
      position: relative;
      width: 148px;
      height: 148px;
      border-radius: 50%;
      background: radial-gradient(circle at center, #010207 60%, #09041a 82%, rgba(0, 210, 255, 0.35) 100%);
      box-shadow: 
        inset 0 0 25px rgba(0, 0, 0, 0.98),
        0 0 35px rgba(121, 40, 202, 0.7),
        0 0 60px rgba(0, 210, 255, 0.3);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 2;
      overflow: hidden;
    }
    .portal-label {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      background: linear-gradient(135deg, #ffffff 20%, #00d2ff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      pointer-events: none;
    }
    .portal-sub {
      font-size: 9px;
      color: rgba(255, 255, 255, 0.65);
      letter-spacing: 1.5px;
      margin-top: 4px;
      text-transform: uppercase;
      font-weight: 600;
    }

    /* АНИМАЦИЯ ЗАТЯГИВАНИЯ В ЧЁРНУЮ ДЫРУ */
    .portal-wrapper.imploding {
      animation: vortexImplode 0.85s cubic-bezier(0.7, 0, 0.84, 0) forwards;
      pointer-events: none;
    }
    @keyframes vortexImplode {
      0% { transform: scale(1) rotate(0deg); filter: brightness(1); }
      35% { transform: scale(1.22) rotate(220deg); filter: brightness(2.5) drop-shadow(0 0 45px #00d2ff); }
      100% { transform: scale(0.005) rotate(1200deg); opacity: 0; filter: blur(12px) brightness(4); }
    }

    /* ========================================= */
    /* ЖИВАЯ СФЕРА ВО ВРЕМЯ РАЗГОВОРА (ORB)      */
    /* ========================================= */
    .visualizer-container {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      width: 100%;
    }
    .visualizer-container.active {
      display: flex;
      animation: emergePortal 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes emergePortal {
      from { transform: scale(0.05); opacity: 0; filter: blur(20px); }
      to { transform: scale(1); opacity: 1; filter: blur(0); }
    }

    .orb-stage {
      position: relative;
      width: 220px;
      height: 220px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Внешние ореолы дыхания сферы */
    .orb-halo-outer {
      position: absolute;
      width: 200px;
      height: 200px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0, 210, 255, 0.3) 0%, rgba(138, 43, 226, 0.15) 50%, transparent 72%);
      filter: blur(18px);
      animation: haloBreath 3s infinite alternate ease-in-out;
    }
    @keyframes haloBreath {
      0% { transform: scale(0.9); opacity: 0.5; }
      100% { transform: scale(1.2); opacity: 0.9; }
    }

    /* Живое биоморфное ядро (органические переливы) */
    .orb-core {
      position: relative;
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #5ee8ff 0%, #0088ff 45%, #7928ca 85%, #180538 100%);
      box-shadow: 
        inset -5px -5px 20px rgba(0, 0, 0, 0.7),
        inset 5px 5px 15px rgba(255, 255, 255, 0.4),
        0 0 40px #00a2ff,
        0 0 80px rgba(121, 40, 202, 0.4);
      transition: transform 0.08s ease, filter 0.15s ease;
      animation: coreDrift 6s infinite alternate ease-in-out;
    }
    @keyframes coreDrift {
      0% { border-radius: 50% 48% 52% 49% / 49% 52% 48% 51%; transform: rotate(0deg); }
      50% { border-radius: 48% 53% 47% 52% / 52% 48% 53% 47%; transform: rotate(180deg) scale(1.03); }
      100% { border-radius: 52% 48% 53% 47% / 47% 53% 48% 52%; transform: rotate(360deg); }
    }

    /* Анимация речи ИИ (JeBoss говорит) */
    .orb-core.speaking {
      animation: orbSpeaking 0.65s infinite alternate ease-in-out;
    }
    @keyframes orbSpeaking {
      0% { 
        transform: scale(0.95); 
        box-shadow: 0 0 35px #00d2ff, 0 0 60px rgba(121, 40, 202, 0.6); 
      }
      100% { 
        transform: scale(1.28); 
        box-shadow: 0 0 65px #00f0ff, 0 0 110px #ff007f; 
        filter: brightness(1.2); 
      }
    }

    /* Блок текста (чистый вид) */
    .transcript-box {
      width: 100%;
      min-height: 64px;
      max-height: 180px;
      overflow-y: auto;
      background: rgba(13, 17, 34, 0.6);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 20px;
      padding: 14px 18px;
      font-size: 14px;
      line-height: 1.45;
      text-align: left;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    }
    .transcript-box.hidden {
      display: none;
    }

    /* ========================================= */
    /* ПРЕМИАЛЬНАЯ ПАНЕЛЬ УПРАВЛЕНИЯ GEMINI BAR   */
    /* ========================================= */
    .control-bar {
      display: none;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      max-width: 440px;
      padding: 10px 14px;
      background: rgba(12, 16, 32, 0.85);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 44px;
      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.65), 0 0 20px rgba(0, 210, 255, 0.08);
      z-index: 30;
    }
    .control-bar.active {
      display: flex;
      animation: slideUpBar 0.45s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes slideUpBar {
      from { transform: translateY(60px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .btn-circle {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      border: none;
      background: rgba(255, 255, 255, 0.07);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
    }
    .btn-circle:active {
      transform: scale(0.88);
      background: rgba(255, 255, 255, 0.16);
    }
    .btn-circle.active-btn {
      background: linear-gradient(135deg, #0088ff, #00d2ff);
      box-shadow: 0 0 20px rgba(0, 210, 255, 0.5);
    }
    .btn-circle.danger {
      background: rgba(255, 46, 99, 0.18);
      color: #ff3366;
    }
    .btn-circle.danger:active {
      background: rgba(255, 46, 99, 0.4);
    }
    .btn-circle svg {
      width: 22px;
      height: 22px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Капсула звуковых волн Gemini */
    .capsule-wave {
      flex: 1;
      height: 50px;
      max-width: 140px;
      margin: 0 8px;
      background: radial-gradient(circle at center, #071947 0%, #03081c 100%);
      border: 1px solid rgba(0, 210, 255, 0.3);
      border-radius: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      cursor: pointer;
      box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.7);
    }
    .wave-bar {
      width: 4px;
      height: 8px;
      background: #00d2ff;
      border-radius: 4px;
      box-shadow: 0 0 6px #00d2ff;
      transition: height 0.08s ease;
    }
    .capsule-wave.speaking .wave-bar:nth-child(1) { animation: liveWave 0.7s infinite 0.1s ease-in-out; }
    .capsule-wave.speaking .wave-bar:nth-child(2) { animation: liveWave 0.7s infinite 0.3s ease-in-out; }
    .capsule-wave.speaking .wave-bar:nth-child(3) { animation: liveWave 0.7s infinite 0.2s ease-in-out; }
    .capsule-wave.speaking .wave-bar:nth-child(4) { animation: liveWave 0.7s infinite 0.4s ease-in-out; }
    .capsule-wave.speaking .wave-bar:nth-child(5) { animation: liveWave 0.7s infinite 0.15s ease-in-out; }

    @keyframes liveWave {
      0%, 100% { height: 8px; }
      50% { height: 28px; background: #ffffff; box-shadow: 0 0 10px #ffffff; }
    }

    #cameraPreview {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
      opacity: 0.38;
      border-radius: 24px;
    }
    #cameraPreview.active {
      display: block;
    }
  </style>
</head>
<body>
  <!-- Фоновый эффект космических частиц -->
  <canvas id="spaceCanvas"></canvas>

  <div class="app">
    <video id="cameraPreview" autoplay playsinline muted></video>

    <!-- Верхняя панель -->
    <div class="header">
      <div class="header-left">
        <div class="title">
          <span>JeBoss</span>
          <span style="font-size: 11px; padding: 2px 7px; background: rgba(0, 210, 255, 0.18); border-radius: 8px; color: #00d2ff; font-weight: 800;">LIVE</span>
        </div>
        <div class="status">
          <span id="statusDot" class="status-dot"></span>
          <span id="statusText">Портал готов</span>
        </div>
      </div>
    </div>

    <!-- Центральная область -->
    <div class="center">
      <!-- ЖИВОЙ КВАНТОВЫЙ ПОРТАЛ -->
      <div id="quantumPortal" class="portal-wrapper" title="Активировать JeBoss">
        <div class="portal-nebula"></div>
        <div class="accretion-disk"></div>
        <div class="orbit-ring"></div>
        <div class="event-horizon">
          <div class="portal-label">Вход</div>
          <div class="portal-sub">JeBoss Live</div>
        </div>
      </div>

      <!-- ВИЗУАЛИЗАТОР ЖИВОЙ СФЕРЫ -->
      <div id="visualizer" class="visualizer-container">
        <div class="orb-stage">
          <div class="orb-halo-outer"></div>
          <div id="orbCore" class="orb-core"></div>
        </div>
        <div id="transcript" class="transcript-box hidden"></div>
      </div>
    </div>

    <!-- Нижняя панель в стиле Gemini -->
    <div id="controlBar" class="control-bar">
      <button id="btnPlus" class="btn-circle" title="Добавить фото">
        <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
      </button>

      <button id="btnCamera" class="btn-circle" title="Включить камеру">
        <svg viewBox="0 0 24 24"><path d="M23 7l-7 5 7 5V7z"></path><rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect></svg>
      </button>

      <div id="capsuleWave" class="capsule-wave" title="Голосовой поток">
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
      </div>

      <button id="btnMic" class="btn-circle active-btn" title="Выключить микрофон">
        <svg id="micIcon" viewBox="0 0 24 24"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>
      </button>

      <button id="btnClose" class="btn-circle danger" title="Завершить лайв">
        <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </button>
    </div>
  </div>

  <input type="file" id="fileInput" accept="image/*" style="display: none;" />

  <script>
    // Фоновые космические микрочастицы (Canvas)
    const canvas = document.getElementById("spaceCanvas");
    const ctx = canvas.getContext("2d");
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      particles = [];
      for (let i = 0; i < 45; i++) {
        particles.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          size: Math.random() * 1.8 + 0.4,
          speedY: Math.random() * 0.4 + 0.1,
          opacity: Math.random() * 0.7 + 0.2
        });
      }
    }
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    function animateSpace() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#00d2ff";
      particles.forEach(p => {
        ctx.globalAlpha = p.opacity;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
        p.y -= p.speedY;
        if (p.y < 0) p.y = canvas.height;
      });
      requestAnimationFrame(animateSpace);
    }
    animateSpace();

    // PWA
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(err => console.warn('SW:', err));
      });
    }

    const proto = window.location.protocol === "https:" ? "wss:" : "ws:";
    const WS_URL = `${proto}//${window.location.host}/ws/live`;

    const quantumPortal = document.getElementById("quantumPortal");
    const controlBar = document.getElementById("controlBar");
    const visualizer = document.getElementById("visualizer");
    const orbCore = document.getElementById("orbCore");
    const capsuleWave = document.getElementById("capsuleWave");
    const statusText = document.getElementById("statusText");
    const statusDot = document.getElementById("statusDot");
    const transcriptEl = document.getElementById("transcript");
    const cameraPreview = document.getElementById("cameraPreview");

    const btnPlus = document.getElementById("btnPlus");
    const btnCamera = document.getElementById("btnCamera");
    const btnMic = document.getElementById("btnMic");
    const btnClose = document.getElementById("btnClose");
    const fileInput = document.getElementById("fileInput");

    let ws = null;
    let audioCtx = null;
    let mediaStream = null;
    let cameraStream = null;
    let processorNode = null;
    let sourceNode = null;
    let isLive = false;
    let isMuted = false;
    let isCameraOn = false;

    function setStatus(msg, active = true) {
      statusText.textContent = msg;
      if (active) statusDot.classList.add("active");
      else statusDot.classList.remove("active");
    }

    function appendLine(label, text) {
      transcriptEl.classList.remove("hidden");
      const line = document.createElement("div");
      line.style.marginBottom = "6px";
      line.innerHTML = `<strong style="color: #00d2ff;">${label}:</strong> ${text}`;
      transcriptEl.appendChild(line);
      transcriptEl.scrollTop = transcriptEl.scrollHeight;
    }

    function floatTo16BitPCM(float32Array) {
      const buffer = new ArrayBuffer(float32Array.length * 2);
      const view = new DataView(buffer);
      let offset = 0;
      for (let i = 0; i < float32Array.length; i++, offset += 2) {
        const s = Math.max(-1, Math.min(1, float32Array[i]));
        view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7fff, true);
      }
      return buffer;
    }

    async function activatePortal() {
      if (isLive) return;

      quantumPortal.classList.add("imploding");
      setStatus("Активация JeBoss...", true);

      try {
        mediaStream = await navigator.mediaDevices.getUserMedia({
          audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
        });

        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContextClass({ sampleRate: 16000 });
        await audioCtx.resume();

        ws = new WebSocket(WS_URL);
        ws.binaryType = "arraybuffer";

        ws.onopen = () => {
          isLive = true;
          setTimeout(() => {
            quantumPortal.style.display = "none";
            quantumPortal.classList.remove("imploding");
            visualizer.classList.add("active");
            controlBar.classList.add("active");
            setStatus("В эфире", true);
          }, 750);

          sourceNode = audioCtx.createMediaStreamSource(mediaStream);
          processorNode = audioCtx.createScriptProcessor(4096, 1, 1);

          processorNode.onaudioprocess = (event) => {
            if (!isLive || !ws || ws.readyState !== WebSocket.OPEN || isMuted) return;
            const inputData = event.inputBuffer.getChannelData(0);
            
            // Живая реакция сферы на голос пользователя
            let sum = 0;
            for (let i = 0; i < inputData.length; i++) sum += Math.abs(inputData[i]);
            const avg = sum / inputData.length;
            if (avg > 0.05 && !orbCore.classList.contains("speaking")) {
              const scale = 1 + Math.min(avg * 1.5, 0.25);
              orbCore.style.transform = `scale(${scale})`;
            } else if (!orbCore.classList.contains("speaking")) {
              orbCore.style.transform = `scale(1)`;
            }

            const pcmBuffer = floatTo16BitPCM(inputData);
            ws.send(pcmBuffer);
          };

          sourceNode.connect(processorNode);
          processorNode.connect(audioCtx.destination);
        };

        ws.onmessage = (event) => {
          if (typeof event.data === "string") {
            try {
              const msg = JSON.parse(event.data);
              if (msg.type === "user_text") appendLine("Ты", msg.text);
              if (msg.type === "ai_text" && msg.show_text) appendLine("JeBoss", msg.text);
              if (msg.type === "status") setStatus(msg.text, true);
              if (msg.type === "audio_mp3" && msg.data) {
                orbCore.classList.add("speaking");
                capsuleWave.classList.add("speaking");

                const audio = new Audio("data:audio/mp3;base64," + msg.data);
                audio.onended = () => {
                  orbCore.classList.remove("speaking");
                  capsuleWave.classList.remove("speaking");
                };
                audio.play().catch(e => console.warn("Audio play:", e));
              }
            } catch (e) {
              console.error(e);
            }
          }
        };

        ws.onclose = () => closePortal();
        ws.onerror = () => setStatus("Ошибка сети", false);

      } catch (err) {
        setStatus("Ошибка: " + err.message, false);
        closePortal();
      }
    }

    function closePortal() {
      isLive = false;
      quantumPortal.style.display = "flex";
      quantumPortal.classList.remove("imploding");
      visualizer.classList.remove("active");
      controlBar.classList.remove("active");
      setStatus("Портал готов", false);

      if (processorNode) { processorNode.disconnect(); processorNode = null; }
      if (sourceNode) { sourceNode.disconnect(); sourceNode = null; }
      if (mediaStream) { mediaStream.getTracks().forEach(t => t.stop()); mediaStream = null; }
      if (cameraStream) { cameraStream.getTracks().forEach(t => t.stop()); cameraStream = null; cameraPreview.classList.remove("active"); isCameraOn = false; }
      if (ws) { try { ws.close(); } catch {} ws = null; }
      if (audioCtx) { audioCtx.close().catch(() => {}); audioCtx = null; }
    }

    quantumPortal.onclick = activatePortal;
    btnClose.onclick = closePortal;

    btnMic.onclick = () => {
      isMuted = !isMuted;
      if (isMuted) {
        btnMic.classList.remove("active-btn");
        btnMic.classList.add("danger");
        setStatus("Микрофон выключен", true);
      } else {
        btnMic.classList.add("active-btn");
        btnMic.classList.remove("danger");
        setStatus("В эфире", true);
      }
    };

    btnCamera.onclick = async () => {
      if (!isCameraOn) {
        try {
          cameraStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
          cameraPreview.srcObject = cameraStream;
          cameraPreview.classList.add("active");
          btnCamera.classList.add("active-btn");
          isCameraOn = true;
          setStatus("Камера активна", true);
        } catch (e) {
          alert("Не удалось включить камеру: " + e.message);
        }
      } else {
        if (cameraStream) cameraStream.getTracks().forEach(t => t.stop());
        cameraPreview.classList.remove("active");
        btnCamera.classList.remove("active-btn");
        isCameraOn = false;
        setStatus("В эфире", true);
      }
    };

    btnPlus.onclick = () => fileInput.click();
    fileInput.onchange = (e) => {
      const file = e.target.files[0];
      if (file) {
        appendLine("Ты", `[Прикрепил фото: ${file.name}]`);
        setStatus("Фото отправлено JeBoss", true);
      }
    };
  </script>
</body>
</html>
