<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>JeBoss Live</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="JeBoss" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#04060f" />

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #04060f;
      --panel: rgba(14, 18, 35, 0.78);
      --accent: #2979ff;
      --text: #f0f4fc;
      --muted: #79869f;
    }
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100dvh;
      width: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      background-image: radial-gradient(circle at 50% 30%, #0d1538 0%, #04060f 80%);
      color: var(--text);
      overflow: hidden;
    }
    .app {
      min-height: 100dvh;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: max(20px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
      text-align: center;
      position: relative;
    }

    /* Верхний хедер */
    .header {
      width: 100%;
      max-width: 440px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 18px;
      background: var(--panel);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      z-index: 10;
    }
    .header-left {
      text-align: left;
    }
    .title {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: 0.3px;
      color: #fff;
    }
    .status {
      font-size: 12px;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #555;
      transition: background 0.3s;
    }
    .status-dot.active {
      background: #00e676;
      box-shadow: 0 0 10px #00e676;
    }

    /* Центральная область */
    .center {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      width: 100%;
      max-width: 440px;
      position: relative;
    }

    /* ========================================= */
    /* ВАРИАНТ 1: QUANTUM PORTAL (ЧЕРНАЯ ДЫРА)    */
    /* ========================================= */
    .portal-wrapper {
      position: relative;
      width: 220px;
      height: 220px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.3s ease;
      z-index: 20;
    }
    .portal-wrapper:active {
      transform: scale(0.96);
    }

    /* Наружный аккреционный световой диск */
    .accretion-disk {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: conic-gradient(
        from 0deg,
        #ff007f 0deg,
        #7928ca 90deg,
        #00d2ff 180deg,
        #ff007f 270deg,
        #7928ca 360deg
      );
      filter: blur(14px);
      opacity: 0.85;
      animation: spinDisk 6s linear infinite;
    }

    /* Тонкие космические орбитальные кольца */
    .orbit-ring {
      position: absolute;
      width: 90%;
      height: 90%;
      border-radius: 50%;
      border: 1.5px solid rgba(0, 210, 255, 0.4);
      border-top-color: #ff007f;
      border-bottom-color: #00d2ff;
      animation: spinReverse 4s linear infinite;
    }

    /* Гравитационная тень горизонта событий */
    .event-horizon {
      position: relative;
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: radial-gradient(circle at center, #000000 62%, #08031a 80%, rgba(255, 0, 127, 0.4) 100%);
      box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.95), 0 0 30px rgba(121, 40, 202, 0.6);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 2;
      overflow: hidden;
    }

    /* Текст внутри сингулярности */
    .portal-label {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      background: linear-gradient(135deg, #ffffff 30%, #00d2ff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      pointer-events: none;
      z-index: 3;
    }
    .portal-sub {
      font-size: 10px;
      color: rgba(255, 255, 255, 0.6);
      letter-spacing: 1px;
      margin-top: 3px;
      text-transform: uppercase;
    }

    @keyframes spinDisk {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes spinReverse {
      from { transform: rotate(360deg) scale(1.03); }
      to { transform: rotate(0deg) scale(0.97); }
    }

    /* АНИМАЦИЯ ЗАТЯГИВАНИЯ В ЧЁРНУЮ ДЫРУ (IMPLOSION / VORTEX) */
    .portal-wrapper.imploding {
      animation: vortexSuck 0.85s cubic-bezier(0.7, 0, 0.84, 0) forwards;
      pointer-events: none;
    }
    @keyframes vortexSuck {
      0% {
        transform: scale(1) rotate(0deg);
        filter: brightness(1);
      }
      40% {
        transform: scale(1.15) rotate(180deg);
        filter: brightness(2) drop-shadow(0 0 35px #00d2ff);
      }
      100% {
        transform: scale(0.01) rotate(1080deg);
        opacity: 0;
        filter: blur(8px) brightness(3);
      }
    }

    /* Визуализатор во время разговора */
    .visualizer-container {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      width: 100%;
    }
    .visualizer-container.active {
      display: flex;
      animation: emergeFromSingularity 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes emergeFromSingularity {
      from { transform: scale(0); opacity: 0; filter: blur(15px); }
      to { transform: scale(1); opacity: 1; filter: blur(0); }
    }

    .orb-glow {
      width: 170px;
      height: 170px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0, 210, 255, 0.35) 0%, rgba(4, 6, 15, 0) 70%);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .orb-core {
      width: 78px;
      height: 78px;
      border-radius: 50%;
      background: linear-gradient(135deg, #00d2ff, #7928ca);
      box-shadow: 0 0 35px #00a2ff;
      transition: transform 0.1s ease;
    }
    .orb-core.speaking {
      animation: orbPulse 1.1s infinite alternate ease-in-out;
    }
    @keyframes orbPulse {
      0% { transform: scale(0.92); box-shadow: 0 0 25px #00d2ff; }
      100% { transform: scale(1.22); box-shadow: 0 0 55px #ff007f; }
    }

    .transcript-box {
      width: 100%;
      min-height: 80px;
      max-height: 200px;
      overflow-y: auto;
      background: rgba(14, 18, 36, 0.6);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 18px;
      padding: 14px;
      font-size: 14px;
      line-height: 1.45;
      text-align: left;
    }
    .transcript-box.hidden {
      display: none;
    }

    /* Нижняя панель Gemini Control Bar */
    .control-bar {
      display: none;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      max-width: 440px;
      padding: 10px 14px;
      background: rgba(15, 20, 38, 0.85);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 40px;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.6);
      z-index: 30;
    }
    .control-bar.active {
      display: flex;
      animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .btn-circle {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: none;
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s;
    }
    .btn-circle:active {
      transform: scale(0.9);
      background: rgba(255, 255, 255, 0.18);
    }
    .btn-circle.active-btn {
      background: #2979ff;
      color: #fff;
    }
    .btn-circle.danger {
      background: rgba(255, 46, 99, 0.2);
      color: #ff3366;
    }
    .btn-circle.danger:active {
      background: rgba(255, 46, 99, 0.4);
    }
    .btn-circle svg {
      width: 22px;
      height: 22px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Центральная овальная капсула волн Gemini */
    .capsule-wave {
      flex: 1;
      height: 48px;
      max-width: 140px;
      margin: 0 10px;
      background: radial-gradient(circle at center, #001f54 0%, #060b24 100%);
      border: 1px solid rgba(0, 162, 255, 0.25);
      border-radius: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      cursor: pointer;
      overflow: hidden;
      position: relative;
    }
    .wave-bar {
      width: 3.5px;
      height: 8px;
      background: #00d2ff;
      border-radius: 4px;
      transition: height 0.1s ease;
    }
    .capsule-wave.speaking .wave-bar:nth-child(1) { animation: wave 0.8s infinite 0.1s; }
    .capsule-wave.speaking .wave-bar:nth-child(2) { animation: wave 0.8s infinite 0.3s; }
    .capsule-wave.speaking .wave-bar:nth-child(3) { animation: wave 0.8s infinite 0.2s; }
    .capsule-wave.speaking .wave-bar:nth-child(4) { animation: wave 0.8s infinite 0.4s; }
    .capsule-wave.speaking .wave-bar:nth-child(5) { animation: wave 0.8s infinite 0.15s; }

    @keyframes wave {
      0%, 100% { height: 8px; }
      50% { height: 26px; background: #fff; }
    }
    @keyframes slideUp {
      from { transform: translateY(50px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    #cameraPreview {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
      opacity: 0.35;
      border-radius: 24px;
    }
    #cameraPreview.active {
      display: block;
    }
  </style>
</head>
<body>
  <div class="app">
    <video id="cameraPreview" autoplay playsinline muted></video>

    <!-- Верхняя панель -->
    <div class="header">
      <div class="header-left">
        <div class="title">JeBoss • Quantum</div>
        <div class="status">
          <span id="statusDot" class="status-dot"></span>
          <span id="statusText">Портал готов</span>
        </div>
      </div>
    </div>

    <!-- Центральная область -->
    <div class="center">
      <!-- QUANTUM PORTAL (КВАНТОВАЯ ЧЕРНАЯ ДЫРА) -->
      <div id="quantumPortal" class="portal-wrapper" title="Активировать JeBoss">
        <div class="accretion-disk"></div>
        <div class="orbit-ring"></div>
        <div class="event-horizon">
          <div class="portal-label">Вход</div>
          <div class="portal-sub">JeBoss Live</div>
        </div>
      </div>

      <!-- Визуализатор во время разговора -->
      <div id="visualizer" class="visualizer-container">
        <div class="orb-glow">
          <div id="orbCore" class="orb-core"></div>
        </div>
        <div id="transcript" class="transcript-box hidden"></div>
      </div>
    </div>

    <!-- Нижняя панель в стиле Gemini -->
    <div id="controlBar" class="control-bar">
      <button id="btnPlus" class="btn-circle" title="Добавить фото">
        <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
      </button>

      <button id="btnCamera" class="btn-circle" title="Включить камеру">
        <svg viewBox="0 0 24 24"><path d="M23 7l-7 5 7 5V7z"></path><rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect></svg>
      </button>

      <div id="capsuleWave" class="capsule-wave" title="Голосовой поток">
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
      </div>

      <button id="btnMic" class="btn-circle active-btn" title="Выключить микрофон">
        <svg id="micIcon" viewBox="0 0 24 24"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>
      </button>

      <button id="btnClose" class="btn-circle danger" title="Завершить лайв">
        <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </button>
    </div>
  </div>

  <input type="file" id="fileInput" accept="image/*" style="display: none;" />

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(err => console.warn('SW:', err));
      });
    }

    const proto = window.location.protocol === "https:" ? "wss:" : "ws:";
    const WS_URL = `${proto}//${window.location.host}/ws/live`;

    const quantumPortal = document.getElementById("quantumPortal");
    const controlBar = document.getElementById("controlBar");
    const visualizer = document.getElementById("visualizer");
    const orbCore = document.getElementById("orbCore");
    const capsuleWave = document.getElementById("capsuleWave");
    const statusText = document.getElementById("statusText");
    const statusDot = document.getElementById("statusDot");
    const transcriptEl = document.getElementById("transcript");
    const cameraPreview = document.getElementById("cameraPreview");

    const btnPlus = document.getElementById("btnPlus");
    const btnCamera = document.getElementById("btnCamera");
    const btnMic = document.getElementById("btnMic");
    const btnClose = document.getElementById("btnClose");
    const fileInput = document.getElementById("fileInput");

    let ws = null;
    let audioCtx = null;
    let mediaStream = null;
    let cameraStream = null;
    let processorNode = null;
    let sourceNode = null;
    let isLive = false;
    let isMuted = false;
    let isCameraOn = false;

    function setStatus(msg, active = true) {
      statusText.textContent = msg;
      if (active) statusDot.classList.add("active");
      else statusDot.classList.remove("active");
    }

    function appendLine(label, text) {
      transcriptEl.classList.remove("hidden");
      const line = document.createElement("div");
      line.style.marginBottom = "6px";
      line.innerHTML = `<strong>${label}:</strong> ${text}`;
      transcriptEl.appendChild(line);
      transcriptEl.scrollTop = transcriptEl.scrollHeight;
    }

    function floatTo16BitPCM(float32Array) {
      const buffer = new ArrayBuffer(float32Array.length * 2);
      const view = new DataView(buffer);
      let offset = 0;
      for (let i = 0; i < float32Array.length; i++, offset += 2) {
        const s = Math.max(-1, Math.min(1, float32Array[i]));
        view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7fff, true);
      }
      return buffer;
    }

    async function activatePortal() {
      if (isLive) return;

      // Запуск эффектной анимации затягивания (Vortex Implosion)
      quantumPortal.classList.add("imploding");
      setStatus("Сингулярность активирована...", true);

      try {
        mediaStream = await navigator.mediaDevices.getUserMedia({
          audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
        });

        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContextClass({ sampleRate: 16000 });
        await audioCtx.resume();

        ws = new WebSocket(WS_URL);
        ws.binaryType = "arraybuffer";

        ws.onopen = () => {
          isLive = true;
          // После завершения затягивания переключаем в эфир
          setTimeout(() => {
            quantumPortal.style.display = "none";
            quantumPortal.classList.remove("imploding");
            visualizer.classList.add("active");
            controlBar.classList.add("active");
            setStatus("В эфире", true);
          }, 700);

          sourceNode = audioCtx.createMediaStreamSource(mediaStream);
          processorNode = audioCtx.createScriptProcessor(4096, 1, 1);

          processorNode.onaudioprocess = (event) => {
            if (!isLive || !ws || ws.readyState !== WebSocket.OPEN || isMuted) return;
            const inputData = event.inputBuffer.getChannelData(0);
            const pcmBuffer = floatTo16BitPCM(inputData);
            ws.send(pcmBuffer);
          };

          sourceNode.connect(processorNode);
          processorNode.connect(audioCtx.destination);
        };

        ws.onmessage = (event) => {
          if (typeof event.data === "string") {
            try {
              const msg = JSON.parse(event.data);
              if (msg.type === "user_text") appendLine("Ты", msg.text);
              if (msg.type === "ai_text" && msg.show_text) appendLine("JeBoss", msg.text);
              if (msg.type === "status") setStatus(msg.text, true);
              if (msg.type === "audio_mp3" && msg.data) {
                orbCore.classList.add("speaking");
                capsuleWave.classList.add("speaking");

                const audio = new Audio("data:audio/mp3;base64," + msg.data);
                audio.onended = () => {
                  orbCore.classList.remove("speaking");
                  capsuleWave.classList.remove("speaking");
                };
                audio.play().catch(e => console.warn("Audio play:", e));
              }
            } catch (e) {
              console.error(e);
            }
          }
        };

        ws.onclose = () => closePortal();
        ws.onerror = () => setStatus("Ошибка сети", false);

      } catch (err) {
        setStatus("Ошибка: " + err.message, false);
        closePortal();
      }
    }

    function closePortal() {
      isLive = false;
      quantumPortal.style.display = "flex";
      quantumPortal.classList.remove("imploding");
      visualizer.classList.remove("active");
      controlBar.classList.remove("active");
      setStatus("Портал готов", false);

      if (processorNode) { processorNode.disconnect(); processorNode = null; }
      if (sourceNode) { sourceNode.disconnect(); sourceNode = null; }
      if (mediaStream) { mediaStream.getTracks().forEach(t => t.stop()); mediaStream = null; }
      if (cameraStream) { cameraStream.getTracks().forEach(t => t.stop()); cameraStream = null; cameraPreview.classList.remove("active"); isCameraOn = false; }
      if (ws) { try { ws.close(); } catch {} ws = null; }
      if (audioCtx) { audioCtx.close().catch(() => {}); audioCtx = null; }
    }

    quantumPortal.onclick = activatePortal;
    btnClose.onclick = closePortal;

    btnMic.onclick = () => {
      isMuted = !isMuted;
      if (isMuted) {
        btnMic.classList.remove("active-btn");
        btnMic.classList.add("danger");
        setStatus("Микрофон выключен", true);
      } else {
        btnMic.classList.add("active-btn");
        btnMic.classList.remove("danger");
        setStatus("В эфире", true);
      }
    };

    btnCamera.onclick = async () => {
      if (!isCameraOn) {
        try {
          cameraStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
          cameraPreview.srcObject = cameraStream;
          cameraPreview.classList.add("active");
          btnCamera.classList.add("active-btn");
          isCameraOn = true;
          setStatus("Камера активна", true);
        } catch (e) {
          alert("Не удалось включить камеру: " + e.message);
        }
      } else {
        if (cameraStream) cameraStream.getTracks().forEach(t => t.stop());
        cameraPreview.classList.remove("active");
        btnCamera.classList.remove("active-btn");
        isCameraOn = false;
        setStatus("В эфире", true);
      }
    };

    btnPlus.onclick = () => fileInput.click();
    fileInput.onchange = (e) => {
      const file = e.target.files[0];
      if (file) {
        appendLine("Ты", `[Прикрепил фото: ${file.name}]`);
        setStatus("Фото отправлено JeBoss", true);
      }
    };
  </script>
</body>
</html>
