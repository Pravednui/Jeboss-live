<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>JeBoss Live</title>
  
  <!-- iOS PWA настройки для iPhone (X - 18 Pro Max) -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="JeBoss" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#0c0d10" />

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #0c0d10;
      --card: #16181f;
      --accent: #ff2e63;
      --active: #00d285;
      --text: #f5f6f8;
      --muted: #9aa0ad;
    }
    * {
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100dvh;
      width: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      background-image: radial-gradient(circle at top, #1d1424 0%, var(--bg) 65%);
      color: var(--text);
    }
    .app {
      min-height: 100dvh;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 20px 16px 28px;
      gap: 20px;
      text-align: center;
    }
    .header {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 18px;
      padding: 14px 16px;
    }
    .title {
      font-size: 18px;
      font-weight: 700;
      margin: 0 0 4px;
    }
    .status {
      font-size: 13px;
      color: var(--muted);
    }
    .center {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      width: 100%;
      max-width: 420px;
    }
    #liveBtn {
      width: 148px;
      height: 148px;
      border-radius: 50%;
      border: none;
      background: var(--accent);
      color: #ffffff;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 0 36px rgba(255, 46, 99, 0.45);
      transition: transform 0.15s ease, background 0.2s ease, box-shadow 0.2s ease;
    }
    #liveBtn.live {
      background: var(--active);
      box-shadow: 0 0 40px rgba(0, 210, 133, 0.5);
      animation: pulse 1.6s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }
    .transcript-box {
      width: 100%;
      min-height: 104px;
      max-height: 240px;
      overflow-y: auto;
      background: var(--card);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 14px;
      font-size: 14px;
      line-height: 1.45;
      color: var(--text);
      text-align: left;
    }
    .hint {
      font-size: 12px;
      color: var(--muted);
      max-width: 360px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <div class="title">JeBoss • Live</div>
      <div id="status" class="status">Отключено</div>
    </div>

    <div class="center">
      <button id="liveBtn" type="button">Включить лайв</button>
      <div id="transcript" class="transcript-box">
        Нажми «Включить лайв», разреши микрофон и говори в обычном темпе.
      </div>
    </div>

    <div class="hint">
      🟢 JeBoss Live подключен • Говори свободно
    </div>
  </div>

  <script>
    // Регистрация Service Worker для PWA на iOS
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(err => {
          console.warn('SW registration failed:', err);
        });
      });
    }

    // Определение адреса WebSocket
    // 1. Из параметров URL: ?ws=wss://your-domain.com
    // 2. Или если открыто на том же хосте (location.host)
    // 3. Или fallback на настроенный сервер
    const urlParams = new URLSearchParams(window.location.search);
    const customWs = urlParams.get("ws");

    let WS_URL;
    if (customWs) {
      WS_URL = customWs.endsWith("/ws/live") ? customWs : `${customWs}/ws/live`;
    } else if (window.location.hostname && window.location.hostname !== "localhost" && !window.location.hostname.includes("github.io")) {
      const proto = window.location.protocol === "https:" ? "wss:" : "ws:";
      WS_URL = `${proto}//${window.location.host}/ws/live`;
    } else {
      // Укажите адрес вашего бэкенда на Render / Railway / ngrok:
      WS_URL = "wss://jeboss-backend.onrender.com/ws/live";
    }

    const liveBtn = document.getElementById("liveBtn");
    const statusEl = document.getElementById("status");
    const transcriptEl = document.getElementById("transcript");

    let tg = null;
    try {
      tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
      if (tg) {
        tg.ready();
        tg.expand();
      }
    } catch (e) {
      console.warn("Telegram WebApp init warning:", e);
    }

    let ws = null;
    let audioCtx = null;
    let mediaStream = null;
    let sourceNode = null;
    let processorNode = null;
    let isLive = false;
    let nextPlayTime = 0;

    function setStatus(msg) {
      statusEl.textContent = msg;
    }

    function appendLine(label, text) {
      if (!text) return;
      const line = document.createElement("div");
      line.style.marginBottom = "8px";
      const strong = document.createElement("strong");
      strong.textContent = label + ": ";
      line.appendChild(strong);
      line.appendChild(document.createTextNode(text));
      transcriptEl.appendChild(line);
      transcriptEl.scrollTop = transcriptEl.scrollHeight;
    }

    function floatTo16BitPCM(float32Array) {
      const buffer = new ArrayBuffer(float32Array.length * 2);
      const view = new DataView(buffer);
      let offset = 0;
      for (let i = 0; i < float32Array.length; i++, offset += 2) {
        const s = Math.max(-1, Math.min(1, float32Array[i]));
        view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7fff, true);
      }
      return buffer;
    }

    function playPcm16Chunk(arrayBuffer, sampleRate = 24000) {
      if (!audioCtx) return;
      const int16 = new Int16Array(arrayBuffer);
      if (int16.length === 0) return;

      const float32 = new Float32Array(int16.length);
      for (let i = 0; i < int16.length; i++) {
        float32[i] = int16[i] / 32768;
      }

      const audioBuffer = audioCtx.createBuffer(1, float32.length, sampleRate);
      audioBuffer.copyToChannel(float32, 0);

      const src = audioCtx.createBufferSource();
      src.buffer = audioBuffer;
      src.connect(audioCtx.destination);

      const now = audioCtx.currentTime;
      if (nextPlayTime < now) {
        nextPlayTime = now + 0.03;
      }
      src.start(nextPlayTime);
      nextPlayTime += audioBuffer.duration;
    }

    async function startLive() {
      try {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          throw new Error("Микрофон недоступен в этом браузере/контексте");
        }
        if (WS_URL.includes("ТВОЙ-БЭКЕНД.com")) {
          throw new Error("Сначала укажи реальный WSS-адрес бэкенда в коде");
        }

        setStatus("Запрашиваю микрофон...");
        mediaStream = await navigator.mediaDevices.getUserMedia({
          audio: {
            echoCancellation: true,
            noiseSuppression: true,
            autoGainControl: true
          }
        });

        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContextClass({ sampleRate: 16000 });
        await audioCtx.resume();
        nextPlayTime = audioCtx.currentTime;

        const initPayload = encodeURIComponent((tg && tg.initData) || "");
        ws = new WebSocket(`${WS_URL}?initData=${initPayload}`);
        ws.binaryType = "arraybuffer";

        ws.onopen = () => {
          isLive = true;
          liveBtn.classList.add("live");
          liveBtn.textContent = "Остановить";
          setStatus("В эфире — говори");

          sourceNode = audioCtx.createMediaStreamSource(mediaStream);
          processorNode = audioCtx.createScriptProcessor(4096, 1, 1);

          processorNode.onaudioprocess = (event) => {
            if (!isLive || !ws || ws.readyState !== WebSocket.OPEN) return;
            const inputData = event.inputBuffer.getChannelData(0);
            const pcmBuffer = floatTo16BitPCM(inputData);
            ws.send(pcmBuffer);
          };

          sourceNode.connect(processorNode);
          processorNode.connect(audioCtx.destination);
        };

        ws.onmessage = (event) => {
          if (typeof event.data === "string") {
            try {
              const msg = JSON.parse(event.data);
              if (msg.type === "user_text") appendLine("Ты", msg.text);
              if (msg.type === "ai_text") appendLine("JeBoss", msg.text);
              if (msg.type === "status") setStatus(msg.text);
              if (msg.type === "audio_mp3" && msg.data) {
                try {
                  const binaryStr = atob(msg.data);
                  const len = binaryStr.length;
                  const bytes = new Uint8Array(len);
                  for (let i = 0; i < len; i++) {
                    bytes[i] = binaryStr.charCodeAt(i);
                  }
                  if (audioCtx) {
                    audioCtx.decodeAudioData(bytes.buffer.slice(0), (buffer) => {
                      const src = audioCtx.createBufferSource();
                      src.buffer = buffer;
                      src.connect(audioCtx.destination);
                      src.start(0);
                    }, (err) => {
                      // Fallback на обычный HTML5 Audio
                      const audio = new Audio("data:audio/mp3;base64," + msg.data);
                      audio.play().catch(e => console.warn("Fallback audio play:", e));
                    });
                  } else {
                    const audio = new Audio("data:audio/mp3;base64," + msg.data);
                    audio.play().catch(e => console.warn("Fallback audio play:", e));
                  }
                } catch (audioErr) {
                  console.error("Audio playback error:", audioErr);
                }
              }
              if (msg.type === "interrupt") {
                nextPlayTime = audioCtx ? audioCtx.currentTime : 0;
              }
            } catch {
              appendLine("JeBoss", event.data);
            }
          } else if (event.data instanceof ArrayBuffer) {
            playPcm16Chunk(event.data, 24000);
          }
        };

        ws.onerror = () => {
          setStatus("Ошибка соединения с сервером");
        };

        ws.onclose = () => {
          stopLive();
        };
      } catch (err) {
        setStatus("Ошибка: " + err.message);
        appendLine("Система", err.message);
        stopLive();
      }
    }

    function stopLive() {
      isLive = false;
      liveBtn.classList.remove("live");
      liveBtn.textContent = "Включить лайв";
      if (!statusEl.textContent.startsWith("Ошибка:")) {
        setStatus("Отключено");
      }

      if (processorNode) {
        processorNode.disconnect();
        processorNode.onaudioprocess = null;
        processorNode = null;
      }
      if (sourceNode) {
        sourceNode.disconnect();
        sourceNode = null;
      }
      if (mediaStream) {
        mediaStream.getTracks().forEach((t) => t.stop());
        mediaStream = null;
      }
      if (ws) {
        try { ws.close(); } catch {}
        ws = null;
      }
      if (audioCtx) {
        audioCtx.close().catch(() => {});
        audioCtx = null;
      }
    }

    liveBtn.onclick = () => {
      if (isLive) stopLive();
      else startLive();
    };
  </script>
</body>
</html>
